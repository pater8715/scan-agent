# Scan Agent v3.0 - Docker Compose Configuration
# ===============================================
# Multi-service setup para Scan Agent v3.0
# Soporta CLI scanning, Web UI, desarrollo, y producción

# ============================================================================
# SERVICIOS PRINCIPALES
# ============================================================================
services:
  
  # -------------------------------------------------------------------------
  # Scan Agent CLI - Para escaneos desde línea de comandos
  # -------------------------------------------------------------------------
  scan-agent-cli:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: scan-agent:3.0.0
    container_name: scan-agent-cli
    hostname: scan-agent-cli
    
    # Capacidades de red para escaneos avanzados
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE  # Para debugging avanzado
    
    # Modo de red host para acceso completo a la red local
    network_mode: host
    
    # Volúmenes para persistir datos
    volumes:
      - ../outputs:/scan-agent/outputs:rw
      - ../reports:/scan-agent/reports:rw
      - ../data:/scan-agent/data:rw
      - ../logs:/scan-agent/logs:rw
      - /etc/localtime:/etc/localtime:ro  # Sincronizar timezone
    
    # Variables de entorno
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SCAN_MODE=cli
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_SCANS=3
    
    # Comando por defecto
    command: ["--help"]
    
    # Recursos limitados
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Reinicio automático en caso de fallo
    restart: unless-stopped
    
    # Solo disponible en perfil CLI
    profiles: ["cli", "all"]

  # -------------------------------------------------------------------------
  # Scan Agent Web UI - Interfaz web con API REST
  # -------------------------------------------------------------------------
  scan-agent-web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: scan-agent:3.0.0
    container_name: scan-agent-web
    hostname: scan-agent-web
    
    # Capacidades mínimas necesarias para escaneos de red
    cap_add:
      - NET_RAW      # Para escaneos básicos (nmap raw sockets)
      - NET_ADMIN    # Para escaneos avanzados
    cap_drop:
      - ALL          # Primero descartar todo, luego añadir solo lo necesario
    security_opt:
      - no-new-privileges:true

    # Red bridge para web UI (IP fija para identificación en reportes)
    networks:
      scan-agent-network:
        ipv4_address: 172.20.0.2

    # Permite escanear el host (máquina real) desde el contenedor
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # Puertos expuestos
    ports:
      - "8080:8080"  # Web UI
      - "8000:8000"  # API alternativa
    
    # Volúmenes para persistir datos
    volumes:
      - ../outputs:/scan-agent/outputs:rw
      - ../reports:/scan-agent/reports:rw
      - ../data:/scan-agent/data:rw
      - ../logs:/scan-agent/logs:rw
      - ../docs/MANUAL_USUARIO.md:/scan-agent/docs/MANUAL_USUARIO.md:ro
      - /etc/localtime:/etc/localtime:ro

    # Variables de entorno para web
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SCAN_MODE=web
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8080
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - MAX_CONCURRENT_SCANS=5
      - ENABLE_API_DOCS=true
      - CORS_ORIGINS=*
      - ALLOW_PUBLIC_TARGETS=true

    # Comando para iniciar web UI
    command: ["--web", "--host", "0.0.0.0", "--port", "8080"]
    
    # Recursos para web UI
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    
    # Healthcheck para web UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Reinicio automático
    restart: unless-stopped
    
    # Solo disponible en perfil web o lab
    profiles: ["web", "lab", "all"]

  # -------------------------------------------------------------------------
  # Scan Agent Analyzer - Solo análisis (sin escaneo activo)
  # -------------------------------------------------------------------------
  scan-agent-analyzer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: scan-agent:3.0.0
    container_name: scan-agent-analyzer
    hostname: scan-agent-analyzer
    
    # Sin capacidades especiales (solo análisis)
    networks:
      scan-agent-network:
        ipv4_address: 172.20.0.7
    
    # Volúmenes solo para análisis
    volumes:
      - ../outputs:/scan-agent/outputs:ro  # Solo lectura
      - ../reports:/scan-agent/reports:rw
      - ../data:/scan-agent/data:rw
      - ../logs:/scan-agent/logs:rw
      - /etc/localtime:/etc/localtime:ro
    
    # Variables de entorno para análisis
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SCAN_MODE=analyzer
      - LOG_LEVEL=INFO
      - ANALYSIS_ONLY=true
    
    # Comando para análisis automático
    command: ["--outputs-dir", "/scan-agent/outputs", "--format", "html"]
    
    # Recursos mínimos
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
    
    # Reinicio en caso de fallo
    restart: unless-stopped
    
    # Solo disponible en perfil analyzer o web
    profiles: ["analyzer", "web", "all"]

  # -------------------------------------------------------------------------
  # OWASP Juice Shop - Aplicación web vulnerable para práctica
  # Acceso: http://localhost:3000  |  Interno: http://juice-shop:3000
  # -------------------------------------------------------------------------
  juice-shop:
    image: bkimminich/juice-shop:v17.1.1
    platform: linux/amd64
    container_name: juice-shop
    hostname: juice-shop
    networks:
      scan-agent-network:
        ipv4_address: 172.20.0.3
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=unsafe
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped
    profiles: ["lab", "all"]

  # -------------------------------------------------------------------------
  # DVWA - Damn Vulnerable Web Application para práctica
  # Acceso: http://localhost:8081  |  usuario: admin / password: password
  # -------------------------------------------------------------------------
  dvwa:
    image: ghcr.io/digininja/dvwa@sha256:00fa10a5de76202e0921212ea814d1f7c408eb3f08e29bfdd5a75ad0ca0a65ff
    platform: linux/amd64
    container_name: dvwa
    hostname: dvwa
    networks:
      scan-agent-network:
        ipv4_address: 172.20.0.4
    ports:
      - "8081:80"
    environment:
      - DB_SERVER=dvwa-db
      - DB_PORT=3306
      - DB_DATABASE=dvwa
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
      - RECAPTCHA_PRIV_KEY=
      - RECAPTCHA_PUB_KEY=
    depends_on:
      - dvwa-db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    profiles: ["lab", "all"]

  # -------------------------------------------------------------------------
  # OWASP ZAP — Escáner de seguridad web activo/pasivo
  # API: http://localhost:8090  |  UI desktop: no disponible en daemon mode
  # -------------------------------------------------------------------------
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    platform: linux/amd64
    container_name: zap
    hostname: zap
    networks:
      scan-agent-network:
        ipv4_address: 172.20.0.5
    ports:
      - "8090:8090"
    command: >
      zap.sh -daemon
      -host 0.0.0.0
      -port 8090
      -config api.key=zap-scan-agent-lab
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
      -config scanner.attackOnStart=false
      -config ajax.browserId=htmlunit
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1.5G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/JSON/core/view/version/?apikey=zap-scan-agent-lab"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    profiles: ["lab", "zap", "all"]

  # -------------------------------------------------------------------------
  # Base de datos para DVWA
  # -------------------------------------------------------------------------
  dvwa-db:
    image: mariadb:10.11
    platform: linux/amd64
    container_name: dvwa-db
    hostname: dvwa-db
    networks:
      scan-agent-network:
        ipv4_address: 172.20.0.6
    environment:
      - MYSQL_ROOT_PASSWORD=dvwa_root
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    volumes:
      - dvwa-db-data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped
    profiles: ["lab", "all"]

  # -------------------------------------------------------------------------
  # Desarrollo - Hot reload y debugging
  # -------------------------------------------------------------------------
  scan-agent-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: app  # Sin optimizaciones de seguridad para desarrollo
    image: scan-agent:3.0.0-dev
    container_name: scan-agent-dev
    hostname: scan-agent-dev
    
    # Capacidades completas para desarrollo
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_PTRACE
    
    # Red host para desarrollo
    network_mode: host
    
    # Volúmenes con código fuente montado para desarrollo
    volumes:
      - ..:/scan-agent:rw          # Código fuente editable
      - /etc/localtime:/etc/localtime:ro
    
    # Variables de desarrollo
    environment:
      - TZ=Europe/Madrid
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - SCAN_MODE=development
      - LOG_LEVEL=DEBUG
      - DEVELOPMENT=true
      - RELOAD=true
    
    # Comando interactivo
    command: ["/bin/bash"]
    
    # Modo interactivo
    stdin_open: true
    tty: true
    
    # Recursos para desarrollo
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
    
    # Solo disponible en perfil development
    profiles: ["dev", "development"]

# ============================================================================
# CONFIGURACIÓN DE REDES
# ============================================================================
networks:
  scan-agent-network:
    name: scan-agent-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
    driver_opts:
      com.docker.network.bridge.name: scan-agent-br

# ============================================================================
# VOLÚMENES NOMBRADOS (OPCIONAL)
# ============================================================================
volumes:
  scan-agent-data:
    name: scan-agent-data
    driver: local
  scan-agent-logs:
    name: scan-agent-logs
    driver: local
  scan-agent-reports:
    name: scan-agent-reports
    driver: local
  scan-agent-outputs:
    name: scan-agent-outputs
    driver: local
  dvwa-db-data:
    name: dvwa-db-data
    driver: local

services:
  - type: web
    name: scan-agent-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SCAN_MODE
        value: web
      - key: LOG_LEVEL
        value: INFO
      - key: JSON_LOGGING
        value: "true"
      - key: ALLOW_PUBLIC_TARGETS
        value: "false"
      # Descomenta y configura para activar autenticación por API key:
      # - key: SCAN_AGENT_API_KEY
      #   generateValue: true
    autoDeploy: true


services:
  - type: web
    name: scan-agent-web
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: starter
    healthCheckPath: /health

    # ── Disco persistente (opcional, requiere plan de pago en Render) ────────
    # Si se activa, el historial de escaneos y el catálogo editado sobreviven
    # a los reinicios y nuevos deploys.  El script de inicio siembra el
    # catálogo automáticamente la primera vez que el disco está vacío.
    #
    # disk:
    #   name: scan-agent-data
    #   mountPath: /app/data
    #   sizeGB: 1

    envVars:
      - key: SCAN_MODE
        value: web

      - key: LOG_LEVEL
        value: info

      - key: JSON_LOGGING
        value: "true"

      # Solo se permiten IPs privadas/locales por defecto.
      # Cambia a "true" con precaución si necesitas escanear hosts externos.
      - key: ALLOW_PUBLIC_TARGETS
        value: "false"

      # API Key de autenticación — descomenta y configura en el dashboard de
      # Render para proteger la API cuando el servicio sea público.
      # - key: SCAN_AGENT_API_KEY
      #   generateValue: true

    autoDeploy: true

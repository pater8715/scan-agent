services:
  - type: web
    name: scan-agent-web
    runtime: python
    plan: starter
    buildCommand: pip install -r webapp/requirements.txt
    startCommand: python3 -m uvicorn webapp.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: SCAN_MODE
        value: web
      - key: LOG_LEVEL
        value: INFO
      - key: JSON_LOGGING
        value: "true"
      - key: ALLOW_PUBLIC_TARGETS
        value: "false"
      # Descomenta y configura para activar autenticación por API key:
      # - key: SCAN_AGENT_API_KEY
      #   generateValue: true
    autoDeploy: true





